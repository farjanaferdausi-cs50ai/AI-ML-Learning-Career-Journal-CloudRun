    <meta charset="UTF-8" />

    <title>AI/ML Learning & Career Journal</title>
    <script>
      // Intercept benign Vite WebSocket/HMR disconnects at the earliest capture point
      (function () {
        function isBenignWsError(err) {
          if (!err) return false;
          var str = '';
          try {
            str = typeof err === 'string' ? err : (err.message || err.stack || err.reason || String(err));
          } catch (e) {}
          str = (str || '').toLowerCase();
          return (
            str.indexOf('websocket') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1
          );
        }

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isBenignWsError(event.reason)) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            if (isBenignWsError(event.error) || isBenignWsError(event.message)) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
              return true;
            }
          },
          true
        );

        // Defensive WebSocket wrapper for Vite client in sandbox environments
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            var ws;
            try {
              ws = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            } catch (err) {
              return {
                readyState: 3,
                close: function () {},
                send: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
            }

            ws.addEventListener('error', function (e) {
              if (e && e.preventDefault) e.preventDefault();
              if (e && e.stopImmediatePropagation) e.stopImmediatePropagation();
            });
            return ws;
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
