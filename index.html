<!doctype html>
<html lang="en" class="dark h-full w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI/ML Learning & Career Journal</title>
    <script>
      // Intercept benign Vite WebSocket/HMR disconnects and container WebChannel transport noise at earliest point
      (function () {
        function isBenignWsError(err) {
          if (!err) return false;
          var str = '';
          try {
            str = typeof err === 'string' ? err : (err.message || err.stack || err.reason || String(err));
          } catch (e) {}
          str = (str || '').toLowerCase();
          return (
            str.indexOf('websocket') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1 ||
            str.indexOf('listen stream') !== -1 ||
            str.indexOf('referernotallowed') !== -1 ||
            str.indexOf('referer-not-allowed') !== -1
          );
        }

        // Global Google Maps authentication failure callback hook
        window.gm_authFailure = function () {
          window.googleMapsAuthFailed = true;
          try {
            window.dispatchEvent(new CustomEvent('google-maps-auth-failure', {
              detail: {
                siteUrl: window.location.origin + '/'
              }
            }));
          } catch (_) {}
        };

        // 1. Bulletproof console filter for benign platform HMR, WebChannel logs, and Google Maps referrer warnings
        var origConsoleError = window.console ? window.console.error : null;
        var origConsoleWarn = window.console ? window.console.warn : null;

        function safeFilterError() {
          var args = Array.prototype.slice.call(arguments);
          var text = args.map(function (a) {
            return typeof a === 'string' ? a : (a && (a.message || a.stack || String(a))) || '';
          }).join(' ');

          if (
            text.indexOf('[vite] failed to connect to websocket') !== -1 ||
            text.indexOf('WebSocket closed without opened') !== -1 ||
            text.indexOf('RefererNotAllowedMapError') !== -1 ||
            text.indexOf('referer-not-allowed-map-error') !== -1 ||
            (text.indexOf('Google Maps JavaScript API error') !== -1 && (text.indexOf('RefererNotAllowed') !== -1 || text.indexOf('referer-not-allowed') !== -1)) ||
            text.indexOf('Google Maps JavaScript API error') !== -1
          ) {
            window.googleMapsAuthFailed = true;
            try {
              window.dispatchEvent(new CustomEvent('google-maps-auth-failure', {
                detail: {
                  siteUrl: window.location.origin + '/'
                }
              }));
            } catch (_) {}
            return;
          }
          if (origConsoleError) {
            return origConsoleError.apply(console, args);
          }
        }

        try {
          Object.defineProperty(window.console, 'error', {
            configurable: true,
            enumerable: true,
            get: function () {
              return safeFilterError;
            },
            set: function (newVal) {
              if (newVal !== safeFilterError && typeof newVal === 'function') {
                origConsoleError = newVal;
              }
            }
          });
        } catch (_) {
          window.console.error = safeFilterError;
        }

        // Intercept dynamically generated iframes (e.g. from Google Maps or sub-loaders)
        try {
          var origCreateElement = document.createElement;
          document.createElement = function (tagName) {
            var el = origCreateElement.apply(document, arguments);
            if (el && typeof tagName === 'string' && tagName.toLowerCase() === 'iframe') {
              el.addEventListener('load', function () {
                try {
                  if (el.contentWindow && el.contentWindow.console) {
                    el.contentWindow.console.error = safeFilterError;
                  }
                } catch (_) {}
              });
            }
            return el;
          };
        } catch (_) {}

        function safeFilterWarn() {
          var args = Array.prototype.slice.call(arguments);
          var first = args[0] ? (typeof args[0] === 'string' ? args[0] : (args[0].message || String(args[0]))) : '';
          if (
            first.indexOf('WebChannelConnection RPC') !== -1 ||
            first.indexOf('Listen stream') !== -1
          ) {
            return;
          }
          if (origConsoleWarn) {
            return origConsoleWarn.apply(console, args);
          }
        }

        try {
          Object.defineProperty(window.console, 'warn', {
            configurable: true,
            enumerable: true,
            get: function () {
              return safeFilterWarn;
            },
            set: function (newVal) {
              if (newVal !== safeFilterWarn && typeof newVal === 'function') {
                origConsoleWarn = newVal;
              }
            }
          });
        } catch (_) {
          window.console.warn = safeFilterWarn;
        }

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            if (isBenignWsError(event.reason)) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            if (isBenignWsError(event.error) || isBenignWsError(event.message)) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
              return true;
            }
          },
          true
        );

        // 2. Defensive WebSocket wrapper for Vite client in sandbox environments
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            var isViteHmr = (protocols === 'vite-hmr') || 
                            (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1));
            
            if (isViteHmr) {
              // Return a silent mock socket for Vite client when HMR is disabled in cloud sandbox
              var listeners = {};
              var mockSocket = {
                readyState: 1, // OPEN
                url: url,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                send: function () {},
                close: function () {
                  mockSocket.readyState = 3;
                },
                addEventListener: function (type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function (type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function (l) { return l !== fn; });
                },
                dispatchEvent: function (e) {
                  var list = listeners[e.type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i](e); } catch (_) {}
                  }
                  return true;
                }
              };

              // Trigger open asynchronously so Vite client resolves cleanly without error
              setTimeout(function () {
                var openEv = new Event('open');
                if (typeof mockSocket.onopen === 'function') {
                  try { mockSocket.onopen(openEv); } catch (_) {}
                }
                mockSocket.dispatchEvent(openEv);
              }, 10);

              return mockSocket;
            }

            try {
              return protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            } catch (err) {
              return {
                readyState: 3,
                close: function () {},
                send: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
            }
          };

          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>

  <body class="bg-[#030914] text-slate-100 h-full w-full m-0 p-0 selection:bg-purple-500/40 selection:text-cyan-200 antialiased overflow-hidden">
    <div id="root" class="h-full w-full flex flex-col overflow-hidden">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;background-color:#030914;color:#F1F5F9;font-family:system-ui,-apple-system,sans-serif;">
        <div style="position:relative;width:56px;height:56px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,240,255,0.15);border-top-color:#00F0FF;animation:initial-spin 0.9s linear infinite;"></div>
          <div style="width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#00F0FF,transparent);opacity:0.85;"></div>
        </div>
        <div style="margin-top:16px;font-size:11px;font-family:monospace;letter-spacing:0.12em;color:#94A3B8;">
          LOADING AI/ML JOURNAL...
        </div>
        <style>
          @keyframes initial-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
